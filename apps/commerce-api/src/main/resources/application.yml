server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml

pg:
  base-url: http://localhost:8082
  callback-url: http://localhost:8080/api/v1/payments/pg/callback
  connect-timeout-millis: 1000
  read-timeout-millis: 3000
  # 재시도 숫자만 여기 둔다. 무엇을 재시도하고 대기를 어떻게 고를지는 RetryingPaymentGateway 에 있다 (07_payment.md E.3·E.4)
  retry:
    max-attempts: 2
    connection-failed-max-wait-millis: 200
    rate-limited-min-wait-millis: 500
    rate-limited-max-wait-millis: 700
    unavailable-min-wait-millis: 300
    unavailable-max-wait-millis: 500
    retry-after-cap-millis: 1000
  # 서킷 숫자만 여기 둔다. 무엇을 실패로 셀지는 CircuitBreakingPaymentGateway 에 있다 (07_payment.md F.1·F.3)
  circuit-breaker:
    sliding-window-size: 20
    minimum-number-of-calls: 10
    failure-rate-threshold: 50
    wait-duration-in-open-state-millis: 10000
    permitted-number-of-calls-in-half-open-state: 3

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local, test

# 모의 PG는 일부러 40%를 500(모름)으로 돌려줘 평소 실패율이 50%에 가깝다. 멀쩡할 때 열리지 않게 올린다 (07_payment.md F.1)
pg:
  circuit-breaker:
    failure-rate-threshold: 70

logging:
  level:
    org.springframework.transaction.interceptor: TRACE
    org.springframework.orm.jpa: DEBUG

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false